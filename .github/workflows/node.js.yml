# Checks every push and pull request to main: the syntax of every JavaScript file
# and the automated tests in server/test, against a throwaway MySQL database that
# exists only for this run. No real database, email or secret is used.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      mysql:
        image: mysql:8.0
        env:
          # A password for this throwaway container only. It is not a secret.
          MYSQL_ROOT_PASSWORD: ci-throwaway-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-throwaway-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DB_NAME: rtwc_ci_test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-throwaway-password
      DB_SSL: "false"

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: server/package-lock.json
    - run: npm ci
    - run: npm run check
