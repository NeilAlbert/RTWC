<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="login-form" novalidate>
        <div class="alert alert-error" id="login-error" role="alert"></div>

        <div class="form-group">
          <label for="login-email">Email address</label>
          <input type="email" id="login-email" name="email" autocomplete="username" required>
          <span class="field-error" id="err-email"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
          <span class="field-error" id="err-password"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>

        <p class="login-note">Authorized staff only. All access is logged.</p>
      </form>
</body>
</html>
