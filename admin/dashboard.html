<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard | Royal Temple Worship Centre Admin</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <main class="admin-content">
        <div class="page-head">
          <h1>Dashboard</h1>
          <p>Overview of site content and pending items.</p>
        </div>

        <div class="alert alert-error" id="dashboard-error" role="alert"></div>

        <div class="stats-grid">
          <div class="stat-card" id="stat-sermons">
            <div class="stat-value">-</div>
            <div class="stat-label">Sermons</div>
            <a class="stat-link" href="sermons.html">View<span class="visually-hidden"> sermons</span></a>
          </div>
          <div class="stat-card" id="stat-events">
            <div class="stat-value">-</div>
            <div class="stat-label">Upcoming events</div>
            <a class="stat-link" href="events.html">View<span class="visually-hidden"> events</span></a>
          </div>
          <div class="stat-card" id="stat-messages">
            <div class="stat-value">-</div>
            <div class="stat-label">New messages</div>
            <a class="stat-link" href="messages.html">View<span class="visually-hidden"> messages</span></a>
          </div>
          <div class="stat-card" id="stat-prayers">
            <div class="stat-value">-</div>
            <div class="stat-label">New prayer requests</div>
            <a class="stat-link" href="prayer-requests.html">View<span class="visually-hidden"> prayer requests</span></a>
          </div>
          <div class="stat-card" id="stat-newsletter">
            <div class="stat-value">-</div>
            <div class="stat-label">Newsletter subscribers</div>
            <a class="stat-link" href="newsletter.html">View<span class="visually-hidden"> newsletter subscribers</span></a>
          </div>
        </div>

        <p class="page-note"><a href="settings.html">Edit the church details shown on the website</a></p>
      </main>
    </div>
  </div>

  <script src="js/adminApi.js"></script>
  <script src="js/adminAuth.js"></script>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
