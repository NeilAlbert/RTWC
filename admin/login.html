<!DOCTYPE html>
<html lang="en" data-admin-page="login">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Log in | Royal Temple Worship Centre admin</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <script src="/admin/js/adminAuth.js"></script>
</head>
<body>
  <main class="login">
    <div class="panel login-panel">
      <h1 class="login-church">Royal Temple Worship Centre</h1>
      <p class="login-denomination">The Church of Pentecost. Website admin.</p>

      <div class="banner banner-info" id="login-notice" role="status" hidden></div>
      <div class="banner banner-error" id="login-error" role="alert" hidden></div>

      <form class="form" id="login-form" novalidate>
        <div class="field">
          <label class="field-label" for="login-email">Email address</label>
          <input class="input" type="email" id="login-email" name="email" autocomplete="username" required>
          <p class="field-error" id="login-email-error" hidden></p>
        </div>

        <div class="field">
          <label class="field-label" for="login-password">Password</label>
          <input class="input" type="password" id="login-password" name="password" autocomplete="current-password" required>
          <p class="field-error" id="login-password-error" hidden></p>
        </div>

        <button class="button button-block" type="submit" id="login-submit">Log in</button>
      </form>
    </div>
  </main>

  <script type="module" src="/admin/js/pages/login.js"></script>
</body>
</html>
