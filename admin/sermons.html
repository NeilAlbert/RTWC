<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sermons | Royal Temple Worship Centre Admin</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <main class="admin-content">
        <div class="page-head has-action">
          <div>
            <h1>Sermons</h1>
            <p>The sermon archive. The newest sermon is listed first.</p>
          </div>
          <button type="button" class="btn btn-primary" id="add-sermon">Add sermon</button>
        </div>

        <div class="alert alert-info">
          The public Sermons page does not read this list yet. It still shows the sermons written in <code>js/pages/sermons.js</code>.
        </div>

        <div class="alert alert-error" id="page-alert" role="alert"></div>

        <form class="filter-bar" id="sermon-search-form" role="search">
          <div class="form-group">
            <label for="sermon-search">Search by title</label>
            <input type="search" id="sermon-search" autocomplete="off" maxlength="200">
          </div>
          <button type="submit" class="btn btn-outline">Search</button>
          <button type="button" class="btn-text" id="sermon-search-clear" hidden>Clear search</button>
        </form>

        <div id="sermon-table"></div>
        <div id="sermon-pagination"></div>
      </main>
    </div>
  </div>

  <script src="js/adminApi.js"></script>
  <script src="js/adminAuth.js"></script>
  <script src="js/components/dom.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/dialog.js"></script>
  <script src="js/components/table.js"></script>
  <script src="js/components/imageUpload.js"></script>
  <script src="js/components/form.js"></script>
  <script src="js/components/crud.js"></script>
  <script src="js/pages/sermons.js"></script>
</body>
</html>
