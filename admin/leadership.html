<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Leadership | Royal Temple Worship Centre Admin</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <main class="admin-content">
        <div class="page-head has-action">
          <div>
            <h1>Leadership</h1>
            <p>The pastor, elders, deacons, deaconesses and ministry leaders.</p>
          </div>
          <button type="button" class="btn btn-primary" id="add-leader">Add leader</button>
        </div>

        <div class="alert alert-info">
          The public About page does not read this list yet. It still shows the leaders written in <code>about.html</code>.
        </div>

        <div class="alert alert-error" id="page-alert" role="alert"></div>

        <div class="filter-bar">
          <div class="form-group">
            <label for="leader-role-filter">Role</label>
            <select id="leader-role-filter">
              <option value="">All roles</option>
            </select>
          </div>
        </div>

        <div id="leader-table"></div>
      </main>
    </div>
  </div>

  <script src="js/adminApi.js"></script>
  <script src="js/adminAuth.js"></script>
  <script src="js/components/dom.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/dialog.js"></script>
  <script src="js/components/table.js"></script>
  <script src="js/components/imageUpload.js"></script>
  <script src="js/components/form.js"></script>
  <script src="js/components/crud.js"></script>
  <script src="js/pages/leadership.js"></script>
</body>
</html>
